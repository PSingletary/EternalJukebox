name: Deploy to Azure

on:
  push:
    branches: [ main, llm ]
    paths:
      - '.github/workflows/deploy-azure.yml'
      - 'docker-compose.yml'
      - 'Dockerfile'
      - 'analysis-service/**'
      - 'src/**'
      - 'deployment/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      azure_container_app:
        description: 'Azure Container App name'
        required: true
        default: 'eternaljukebox'
      azure_resource_group:
        description: 'Azure Resource Group'
        required: true
        default: 'eternaljukebox-rg'

env:
  REGISTRY_NAME: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
  IMAGE_NAME_MAIN: eternaljukebox-main
  IMAGE_NAME_ANALYSIS: eternaljukebox-analysis
  CONTAINER_APP_NAME: ${{ github.event.inputs.azure_container_app || 'eternaljukebox' }}
  RESOURCE_GROUP: ${{ github.event.inputs.azure_resource_group || 'eternaljukebox-rg' }}
  LOCATION: 'East US'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.REGISTRY_NAME }}.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Extract metadata for main app
      id: meta-main
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME_MAIN }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push main application image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta-main.outputs.tags }}
        labels: ${{ steps.meta-main.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

    - name: Extract metadata for analysis service
      id: meta-analysis
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME_ANALYSIS }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push analysis service image
      uses: docker/build-push-action@v5
      with:
        context: ./analysis-service
        file: ./analysis-service/Dockerfile
        push: true
        tags: ${{ steps.meta-analysis.outputs.tags }}
        labels: ${{ steps.meta-analysis.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  deploy-to-azure-container-apps:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps (Main Service)
      uses: azure/container-apps-deploy-action@v1
      with:
        acrName: ${{ env.REGISTRY_NAME }}
        containerAppName: ${{ env.CONTAINER_APP_NAME }}-main
        resourceGroup: ${{ env.RESOURCE_GROUP }}
        imageToDeploy: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME_MAIN }}:${{ github.ref_name }}-${{ github.sha }}
        environmentVariables: |
          PORT=8080
          ANALYSIS_SERVICE_URL=http://${{ env.CONTAINER_APP_NAME }}-analysis:5000
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          STORAGE_TYPE=LOCAL
          DATABASE_TYPE=H2
        ingress: external
        targetPort: 8080
        minReplicas: 1
        maxReplicas: 10

    - name: Deploy to Azure Container Apps (Analysis Service)
      uses: azure/container-apps-deploy-action@v1
      with:
        acrName: ${{ env.REGISTRY_NAME }}
        containerAppName: ${{ env.CONTAINER_APP_NAME }}-analysis
        resourceGroup: ${{ env.RESOURCE_GROUP }}
        imageToDeploy: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME_ANALYSIS }}:${{ github.ref_name }}-${{ github.sha }}
        environmentVariables: |
          FLASK_ENV=production
          PYTHONPATH=/app
        ingress: internal
        targetPort: 5000
        minReplicas: 1
        maxReplicas: 5

    - name: Run health checks
      run: |
        echo "Waiting for services to be ready..."
        sleep 30
        
        # Get the main service URL
        MAIN_URL=$(az containerapp show \
          --name ${{ env.CONTAINER_APP_NAME }}-main \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --query properties.configuration.ingress.fqdn \
          --output tsv)
        
        echo "Main service URL: https://$MAIN_URL"
        
        # Health check for main service
        echo "Checking main service health..."
        curl -f "https://$MAIN_URL/healthy" || exit 1
        
        echo "✅ Deployment successful!"
        echo "🌐 Main service: https://$MAIN_URL"
        echo "📊 Analysis service: Internal (port 5000)"

    - name: Update deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment completed successfully"
          echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
          echo "Container App: ${{ env.CONTAINER_APP_NAME }}"
          echo "Resource Group: ${{ env.RESOURCE_GROUP }}"
        else
          echo "❌ Deployment failed"
          exit 1
        fi

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  notify:
    needs: [build-and-push, deploy-to-azure-container-apps, security-scan]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Deployment notification
      run: |
        if [ "${{ needs.deploy-to-azure-container-apps.result }}" == "success" ]; then
          echo "🎉 Deployment to Azure Container Apps completed successfully!"
          echo "Environment: ${{ github.event.inputs.environment || 'staging' }}"
          echo "Container App: ${{ env.CONTAINER_APP_NAME }}"
          echo "Resource Group: ${{ env.RESOURCE_GROUP }}"
        else
          echo "❌ Deployment failed"
          exit 1
        fi
