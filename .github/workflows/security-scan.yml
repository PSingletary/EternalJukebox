name: Security Scan

on:
  push:
    branches: [ main, llm, develop ]
  pull_request:
    branches: [ main, llm ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Run Gradle dependency check
      run: |
        ./gradlew dependencyCheckAnalyze --info
      env:
        OWASP_DEPENDENCY_CHECK_DB_DRIVER: org.h2.Driver
        OWASP_DEPENDENCY_CHECK_DB_CONNECTION_STRING: jdbc:h2:mem:dc;MODE=MYSQL;DATABASE_TO_LOWER=TRUE
        OWASP_DEPENDENCY_CHECK_DB_USER: dcuser
        OWASP_DEPENDENCY_CHECK_DB_PASSWORD: dcpass
        
    - name: Run Python dependency scan
      run: |
        cd analysis-service
        pip install safety
        safety check --json --output safety-report.json || true
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true
        
    - name: Run npm audit (if package.json exists)
      run: |
        if [ -f "package.json" ]; then
          npm audit --audit-level=moderate --json > npm-audit.json || true
        fi
        
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          build/reports/dependency-check-report.html
          analysis-service/safety-report.json
          analysis-service/bandit-report.json
          npm-audit.json
        retention-days: 30

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Run SpotBugs analysis
      run: |
        ./gradlew spotbugsMain spotbugsTest --info
        
    - name: Run PMD analysis
      run: |
        ./gradlew pmdMain pmdTest --info
        
    - name: Run Checkstyle
      run: |
        ./gradlew checkstyleMain checkstyleTest --info
        
    - name: Run Python linting
      run: |
        cd analysis-service
        pip install flake8 black isort mypy
        flake8 . --output-file=flake8-report.txt || true
        black --check --diff . > black-report.txt || true
        isort --check-only --diff . > isort-report.txt || true
        mypy . --json-report mypy-report.json || true
        
    - name: Run JavaScript linting
      run: |
        if [ -f "package.json" ]; then
          npm install
          npm run lint || true
        else
          # Basic ESLint check for JS files
          npx eslint _web/_includes/*.html _web/_layouts/*.html --ext .js,.html || true
        fi
        
    - name: Upload quality reports
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: |
          build/reports/spotbugs/
          build/reports/pmd/
          build/reports/checkstyle/
          analysis-service/flake8-report.txt
          analysis-service/black-report.txt
          analysis-service/isort-report.txt
          analysis-service/mypy-report.json
        retention-days: 30

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build Docker images
      run: |
        docker build -t eternal-jukebox:latest .
        docker build -t eternal-jukebox-analysis:latest -f analysis-service/Dockerfile analysis-service/
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'eternal-jukebox:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Run Trivy on analysis service
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'eternal-jukebox-analysis:latest'
        format: 'sarif'
        output: 'trivy-analysis-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
        
    - name: Upload analysis service scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-analysis-results.sarif'

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Run TruffleHog OSS
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

  sast-scan:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: java, javascript, python
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      
    - name: Upload CodeQL results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ../results/java.sarif

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, code-quality, container-scan, secret-scan, sast-scan]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Generate security summary
      run: |
        echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Scan Results:" >> $GITHUB_STEP_SUMMARY
        echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Container Scan: ${{ needs.container-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Secret Detection: ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- SAST Analysis: ${{ needs.sast-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Next Steps:" >> $GITHUB_STEP_SUMMARY
        echo "1. Review security reports in artifacts" >> $GITHUB_STEP_SUMMARY
        echo "2. Address any critical vulnerabilities" >> $GITHUB_STEP_SUMMARY
        echo "3. Update dependencies if needed" >> $GITHUB_STEP_SUMMARY
        echo "4. Implement recommended security fixes" >> $GITHUB_STEP_SUMMARY
