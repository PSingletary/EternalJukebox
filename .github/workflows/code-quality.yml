name: Code Quality Gates

on:
  push:
    branches: [ main, llm, develop ]
  pull_request:
    branches: [ main, llm ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('analysis-service/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Build project
      run: |
        ./gradlew build --no-daemon
        
    - name: Run tests
      run: |
        ./gradlew test --no-daemon
        
    - name: Run Python tests
      run: |
        cd analysis-service
        pip install -r requirements.txt
        python -m pytest test_service.py -v
        
    - name: Generate test report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Gradle Tests
        path: build/test-results/test/*.xml
        reporter: java-junit
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          build/test-results/
          build/reports/tests/
        retention-days: 30

  linting:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Run Kotlin linting
      run: |
        ./gradlew ktlintCheck --no-daemon
        
    - name: Fix Kotlin formatting
      run: |
        ./gradlew ktlintFormat --no-daemon
        
    - name: Run Python linting
      run: |
        cd analysis-service
        pip install flake8 black isort
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        black --check --diff .
        isort --check-only --diff .
        
    - name: Run JavaScript/HTML linting
      run: |
        # Install HTMLHint for HTML linting
        npm install -g htmlhint
        htmlhint _web/**/*.html || true
        
        # Check for common JS issues in HTML files
        grep -r "console.log" _web/ || true
        grep -r "alert(" _web/ || true
        grep -r "eval(" _web/ || true

  complexity-analysis:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Run complexity analysis
      run: |
        ./gradlew cpdCheck --no-daemon
        
    - name: Generate complexity report
      run: |
        # Custom complexity analysis
        echo "## 📊 Code Complexity Analysis" > complexity-report.md
        echo "" >> complexity-report.md
        
        # Count lines of code
        echo "### Lines of Code" >> complexity-report.md
        echo "- Kotlin: $(find src/main/kotlin -name "*.kt" | xargs wc -l | tail -1)" >> complexity-report.md
        echo "- Python: $(find analysis-service -name "*.py" | xargs wc -l | tail -1)" >> complexity-report.md
        echo "- JavaScript: $(find _web -name "*.js" | xargs wc -l | tail -1)" >> complexity-report.md
        echo "- HTML: $(find _web -name "*.html" | xargs wc -l | tail -1)" >> complexity-report.md
        echo "" >> complexity-report.md
        
        # Function/method counts
        echo "### Function Counts" >> complexity-report.md
        echo "- Kotlin functions: $(grep -r "fun " src/main/kotlin | wc -l)" >> complexity-report.md
        echo "- Python functions: $(grep -r "def " analysis-service | wc -l)" >> complexity-report.md
        echo "" >> complexity-report.md
        
        # Complexity metrics
        echo "### Complexity Metrics" >> complexity-report.md
        echo "- Large files (>200 lines): $(find . -name "*.kt" -o -name "*.py" -o -name "*.js" | xargs wc -l | awk '$1 > 200' | wc -l)" >> complexity-report.md
        echo "- Long functions (>50 lines): $(grep -r "fun \|def " src/main/kotlin analysis-service | wc -l)" >> complexity-report.md
        
    - name: Upload complexity report
      uses: actions/upload-artifact@v4
      with:
        name: complexity-report
        path: complexity-report.md

  documentation-check:
    name: Documentation Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check documentation
      run: |
        echo "## 📚 Documentation Quality Check" > doc-report.md
        echo "" >> doc-report.md
        
        # Check for missing README sections
        echo "### README.md Analysis" >> doc-report.md
        if [ -f "README.md" ]; then
          echo "✅ README.md exists" >> doc-report.md
          if grep -q "Installation" README.md; then
            echo "✅ Installation section found" >> doc-report.md
          else
            echo "❌ Missing Installation section" >> doc-report.md
          fi
          
          if grep -q "Usage" README.md; then
            echo "✅ Usage section found" >> doc-report.md
          else
            echo "❌ Missing Usage section" >> doc-report.md
          fi
          
          if grep -q "Contributing" README.md; then
            echo "✅ Contributing section found" >> doc-report.md
          else
            echo "❌ Missing Contributing section" >> doc-report.md
          fi
        else
          echo "❌ README.md missing" >> doc-report.md
        fi
        
        # Check for code comments
        echo "" >> doc-report.md
        echo "### Code Documentation" >> doc-report.md
        echo "- Kotlin files with comments: $(find src/main/kotlin -name "*.kt" -exec grep -l "//\|/\*" {} \; | wc -l)" >> doc-report.md
        echo "- Python files with docstrings: $(find analysis-service -name "*.py" -exec grep -l '""".*"""' {} \; | wc -l)" >> doc-report.md
        
        # Check for TODO/FIXME comments
        echo "" >> doc-report.md
        echo "### Technical Debt" >> doc-report.md
        echo "- TODO comments: $(grep -r "TODO" src/ analysis-service/ | wc -l)" >> doc-report.md
        echo "- FIXME comments: $(grep -r "FIXME" src/ analysis-service/ | wc -l)" >> doc-report.md
        
    - name: Upload documentation report
      uses: actions/upload-artifact@v4
      with:
        name: documentation-report
        path: doc-report.md

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [build-and-test, linting, complexity-analysis, documentation-check]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Evaluate quality gates
      run: |
        echo "## 🚦 Quality Gates Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Check build status
        if [ "${{ needs.build-and-test.result }}" = "success" ]; then
          echo "✅ **Build and Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build and Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check linting status
        if [ "${{ needs.linting.result }}" = "success" ]; then
          echo "✅ **Code Linting**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Code Linting**: WARNINGS" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check complexity status
        if [ "${{ needs.complexity-analysis.result }}" = "success" ]; then
          echo "✅ **Complexity Analysis**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Complexity Analysis**: NEEDS REVIEW" >> $GITHUB_STEP_SUMMARY
        fi
        
        # Check documentation status
        if [ "${{ needs.documentation-check.result }}" = "success" ]; then
          echo "✅ **Documentation**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ **Documentation**: NEEDS IMPROVEMENT" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Quality Metrics:" >> $GITHUB_STEP_SUMMARY
        echo "- All tests must pass" >> $GITHUB_STEP_SUMMARY
        echo "- Code must pass linting checks" >> $GITHUB_STEP_SUMMARY
        echo "- Complexity should be within acceptable limits" >> $GITHUB_STEP_SUMMARY
        echo "- Documentation should be comprehensive" >> $GITHUB_STEP_SUMMARY
        
        # Fail if critical gates fail
        if [ "${{ needs.build-and-test.result }}" != "success" ]; then
          echo "❌ Quality gates failed: Build and tests must pass"
          exit 1
        fi
