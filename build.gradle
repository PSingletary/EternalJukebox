plugins {
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '1.9.25'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

mainClassName = 'org.abimon.eternalJukebox.EternalJukebox'

sourceCompatibility = 11
targetCompatibility = 11

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

ext {
    kotlin_version = '1.9.25'
    vertx_version = '3.9.16'
    jackson_version = '2.18.2'
    new_pipe_extractor_version = 'master-SNAPSHOT'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1"

    implementation "io.vertx:vertx-web:$vertx_version"
    implementation "io.vertx:vertx-web-client:$vertx_version"
    implementation "io.vertx:vertx-lang-kotlin:$vertx_version"
    implementation "io.vertx:vertx-lang-kotlin-coroutines:$vertx_version"

    implementation "com.h2database:h2:1.4.196"
    implementation 'com.mysql:mysql-connector-j:9.0.0'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    // Removed: com.google.cloud.sql:mysql-socket-factory-connector-j-8 (Spotify-specific)
    // Removed: com.auth0:java-jwt (Spotify authentication)
    implementation 'com.github.kittinunf.fuel:fuel:2.3.1'
    implementation 'com.github.kittinunf.fuel:fuel-coroutines:2.3.1'

    // Security dependencies
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    implementation 'io.vertx:vertx-auth-jwt:3.9.16'
    implementation 'io.vertx:vertx-auth-common:3.9.16'
    implementation 'org.mindrot:jbcrypt:0.4'

    implementation 'ch.qos.logback:logback-classic:1.5.7'

    implementation "com.fasterxml.jackson.core:jackson-core:$jackson_version"
    implementation "com.fasterxml.jackson.core:jackson-annotations:$jackson_version"
    implementation "com.fasterxml.jackson.core:jackson-databind:$jackson_version"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:$jackson_version"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:$jackson_version"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$jackson_version"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:$jackson_version"
    implementation "com.fasterxml.jackson.module:jackson-module-parameter-names:$jackson_version"

    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    implementation 'com.jakewharton.fliptables:fliptables:1.1.1'

    implementation "com.github.teamnewpipe.NewPipeExtractor:extractor:$new_pipe_extractor_version"
    implementation "com.github.teamnewpipe.NewPipeExtractor:timeago-parser:$new_pipe_extractor_version"

    // Test dependencies
    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
    testImplementation "io.vertx:vertx-junit5:$vertx_version"
    testImplementation "io.vertx:vertx-web-client:$vertx_version"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.1"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:5.10.1"
    testImplementation "org.junit.jupiter:junit-jupiter-params:5.10.1"
    testImplementation "org.mockito:mockito-core:5.8.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.8.0"
    testImplementation "org.assertj:assertj-core:3.25.3"

    // Security testing dependencies
    testImplementation "com.github.spotbugs:spotbugs-annotations:4.8.3"
    testImplementation "com.github.spotbugs:spotbugs:4.8.3"
    testImplementation "org.owasp:dependency-check-gradle:8.4.3"
}

// Security testing configuration
apply plugin: 'com.github.spotbugs'
apply plugin: 'org.owasp.dependencycheck'

spotbugs {
    toolVersion = '4.8.3'
    effort = 'max'
    reportLevel = 'low'
    excludeFilter = file('spotbugs-exclude.xml')
}

spotbugsMain {
    reports {
        html {
            enabled = true
            destination = file("$buildDir/reports/spotbugs/main.html")
        }
        xml {
            enabled = true
            destination = file("$buildDir/reports/spotbugs/main.xml")
        }
    }
}

spotbugsTest {
    reports {
        html {
            enabled = true
            destination = file("$buildDir/reports/spotbugs/test.html")
        }
        xml {
            enabled = true
            destination = file("$buildDir/reports/spotbugs/test.xml")
        }
    }
}

dependencyCheck {
    format = 'ALL'
    suppressionFile = 'dependency-check-suppressions.xml'
    failBuildOnCVSS = 7
    analyzers {
        assemblyEnabled = false
        nugetconfEnabled = false
        nodeEnabled = false
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '11'
    }
}
