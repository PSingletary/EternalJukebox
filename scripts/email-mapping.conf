# =============================================================================
# USAGE INSTRUCTIONS
# =============================================================================

# 1. Update the NEW_DOMAIN and NEW_LOCAL_DOMAIN variables above
# 2. Review and update any specific email mappings as needed
# 3. Run the update script: ./scripts/update-emails.sh
# 4. Review the changes and test the updated configuration
# 5. Update your DNS records and email server configuration

# =============================================================================
# NOTES
# =============================================================================

# - Test emails (test@example.com, etc.) are intentionally not updated
# - Third-party emails (gilbueno.mail@gmail.com) are intentionally not updated
