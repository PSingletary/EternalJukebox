# EternalJukebox Email Address Mapping Configuration
# This file contains all email address mappings for automated updates

# =============================================================================
# DOMAIN CONFIGURATION
# =============================================================================

# New domain for production emails (replace with your actual domain)
NEW_DOMAIN=yourdomain.com

# New domain for internal/local emails (replace with your actual local domain)
NEW_LOCAL_DOMAIN=yourdomain.local

# =============================================================================
# PRODUCTION EMAIL ADDRESSES
# =============================================================================

# Security vulnerability reporting email
NEW_SECURITY_EMAIL=security@yourdomain.com

# General support email
NEW_SUPPORT_EMAIL=support@yourdomain.com

# =============================================================================
# INTERNAL EMAIL ADDRESSES
# =============================================================================

# Internal security team email
