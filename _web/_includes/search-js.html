<script type="text/javascript">

var selectedSongs = [];

// Security functions
function sanitizeInput(input) {
    if (!input) return '';
    return input.replace(/[<>\"'&]/g, '')  // Remove HTML/XML characters
                .replace(/[\x00-\x1F\x7F]/g, '')  // Remove control characters
                .trim();
}

function validateUrl(url) {
    try {
        var urlObj = new URL(url);
        var allowedHosts = [
            'youtube.com', 'www.youtube.com', 'youtu.be',
            'soundcloud.com', 'www.soundcloud.com',
            'bandcamp.com', 'www.bandcamp.com',
            'vimeo.com', 'www.vimeo.com',
            'localhost', '127.0.0.1'
        ];
        return allowedHosts.includes(urlObj.hostname.toLowerCase());
    } catch (e) {
        return false;
    }
}

function searchForTrack() {
    console.log("search for a track");
    var rawQuery = $("#search").val();
    var q = sanitizeInput(rawQuery);
    console.log(q);

    if (q.length > 0) {
        var url = 'api/analysis/search';
        $.getJSON(url, {query: q, results: 30}, function (data) {
            console.log(data);

            $("#pick").hide();
            $("#popular-list").hide();
            listTracks('#search-list', data);
        });
    }
}

function listTracks(listElem, tracks) {
    $(listElem).empty();
    for (var i = 0; i < tracks.length; i++) {
        var s = tracks[i];
        var item = listSong(s);
        if (item) {
            $(listElem).append(listSong(s));
        }
    }
}

function listSong(r) {
    var title = getTitle(r.title, r.artist, null);
    var item = null;
    if (title) {
        item = $('<a>').append(title);

        item.attr('class', 'song-link');
        item.attr('role', 'listitem');
        item.attr('href', "{% if page.app == 'jukebox' %}jukebox{% elsif page.app == 'canonizer' %}canonizer{% endif %}_go.html?id=" + r.id);
    }
    return item;
}

function getTitle(title, artist, url) {
    if (title == undefined || title.length == 0 || title === '(unknown title)' || title == 'undefined') {
        if (url) {
            title = extractTitle(url);
        } else {
            title = null;
        }
    } else {
        if (artist !== '(unknown artist)') {
            title = title + ' by ' + artist;
        }
    }
    return title;
}

function goDirect() {
    var rawUrl = $("#direct-url").val().trim();
    var url = sanitizeInput(rawUrl);
    
    if (!url) {
        alert("Please enter a valid URL (YouTube, SoundCloud, Bandcamp, Vimeo, etc.)");
        return;
    }
    
    // Validate URL format and security
    if (!validateUrl(url)) {
        alert("Please enter a valid URL from supported platforms (YouTube, SoundCloud, Bandcamp, Vimeo, etc.)");
        return;
    }
    
    // Call the new /analyse/url endpoint
    var params = new URLSearchParams({url: url});
    window.location.href = "{% if page.app == 'jukebox' %}jukebox{% elsif page.app == 'canonizer' %}canonizer{% endif %}_go.html?url=" + encodeURIComponent(url);
}

function init() {
    $("#go-search").click(function () {
        searchForTrack();
    });

    $("#search").keyup(function (e) {
        if (e.keyCode == 13) {
            searchForTrack();
        }
    });

    $("#go-direct").click(function () {
        goDirect();
    });

    $("#direct-url").keyup(function (e) {
        if (e.keyCode == 13) {
            goDirect();
        }
    });

    $.getJSON('api/site/popular/{% if page.app == 'jukebox' %}jukebox{% elsif page.app == 'canonizer' %}canonizer{% endif %}', {count: 30}, function (data) {
        listTracks('#popular-list', data);
    });
}

window.onload = init;

</script>
