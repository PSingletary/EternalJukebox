# EternalJukebox Security Monitoring Rules
# These rules define security-specific alerts and monitoring

groups:
  # Authentication and Authorization Security
  - name: eternaljukebox.security.auth
    rules:
      # Failed authentication attempts
      - alert: EternalJukeboxFailedAuthAttempts
        expr: rate(eternaljukebox_auth_failed_attempts_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          category: security
          service: authentication
        annotations:
          summary: "High rate of failed authentication attempts"
          description: "Failed authentication attempts rate is above 0.1 per second for more than 2 minutes."

      # Brute force attack detection
      - alert: EternalJukeboxBruteForceAttack
        expr: rate(eternaljukebox_auth_failed_attempts_total[5m]) > 1
        for: 1m
        labels:
          severity: critical
          category: security
          service: authentication
        annotations:
          summary: "Potential brute force attack detected"
          description: "Failed authentication attempts rate is above 1 per second for more than 1 minute."

      # JWT token validation failures
      - alert: EternalJukeboxJWTValidationFailures
        expr: rate(eternaljukebox_jwt_validation_failures_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          category: security
          service: authentication
        annotations:
          summary: "High rate of JWT validation failures"
          description: "JWT token validation failures rate is above 0.05 per second for more than 2 minutes."

      # Suspicious token usage patterns
      - alert: EternalJukeboxSuspiciousTokenUsage
        expr: rate(eternaljukebox_jwt_suspicious_usage_total[5m]) > 0.02
        for: 1m
        labels:
          severity: critical
          category: security
          service: authentication
        annotations:
          summary: "Suspicious JWT token usage detected"
          description: "Suspicious JWT token usage rate is above 0.02 per second for more than 1 minute."

  # Input Validation and Injection Security
  - name: eternaljukebox.security.injection
    rules:
      # SQL injection attempts
      - alert: EternalJukeboxSQLInjectionAttempts
        expr: rate(eternaljukebox_security_sql_injection_attempts_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: security
          service: input-validation
        annotations:
          summary: "SQL injection attempt detected"
          description: "SQL injection attempt detected in the last 5 minutes."

      # XSS attack attempts
      - alert: EternalJukeboxXSSAttempts
        expr: rate(eternaljukebox_security_xss_attempts_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: security
          service: input-validation
        annotations:
          summary: "XSS attack attempt detected"
          description: "Cross-site scripting (XSS) attack attempt detected in the last 5 minutes."

      # SSRF attack attempts
      - alert: EternalJukeboxSSRFAttempts
        expr: rate(eternaljukebox_security_ssrf_attempts_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: security
          service: input-validation
        annotations:
          summary: "SSRF attack attempt detected"
          description: "Server-side request forgery (SSRF) attack attempt detected in the last 5 minutes."

      # Path traversal attempts
      - alert: EternalJukeboxPathTraversalAttempts
        expr: rate(eternaljukebox_security_path_traversal_attempts_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: security
          service: input-validation
        annotations:
          summary: "Path traversal attempt detected"
          description: "Path traversal attack attempt detected in the last 5 minutes."

      # Command injection attempts
      - alert: EternalJukeboxCommandInjectionAttempts
        expr: rate(eternaljukebox_security_command_injection_attempts_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: security
          service: input-validation
        annotations:
          summary: "Command injection attempt detected"
          description: "Command injection attack attempt detected in the last 5 minutes."

  # Rate Limiting and DoS Protection
  - name: eternaljukebox.security.rate-limiting
    rules:
      # Rate limit exceeded
      - alert: EternalJukeboxRateLimitExceeded
        expr: rate(eternaljukebox_rate_limit_exceeded_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          category: security
          service: rate-limiting
        annotations:
          summary: "High rate of rate limit violations"
          description: "Rate limit violations rate is above 0.1 per second for more than 2 minutes."

      # Potential DoS attack
      - alert: EternalJukeboxPotentialDoSAttack
        expr: rate(eternaljukebox_rate_limit_exceeded_total[5m]) > 1
        for: 1m
        labels:
          severity: critical
          category: security
          service: rate-limiting
        annotations:
          summary: "Potential DoS attack detected"
          description: "Rate limit violations rate is above 1 per second for more than 1 minute."

      # Unusual request patterns
      - alert: EternalJukeboxUnusualRequestPatterns
        expr: rate(eternaljukebox_unusual_request_patterns_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          category: security
          service: rate-limiting
        annotations:
          summary: "Unusual request patterns detected"
          description: "Unusual request patterns rate is above 0.05 per second for more than 2 minutes."

  # File and Data Security
  - name: eternaljukebox.security.files
    rules:
      # Suspicious file uploads
      - alert: EternalJukeboxSuspiciousFileUploads
