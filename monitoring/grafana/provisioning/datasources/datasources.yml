{
  "apiVersion": 1,
  "datasources": [
    {
      "access": "proxy",
      "basicAuth": false,
      "name": "Prometheus",
      "type": "prometheus",
      "url": "http://prometheus:9090",
      "isDefault": true,
      "jsonData": {
        "httpMethod": "POST",
        "queryTimeout": "60s",
        "timeInterval": "15s"
      }
    },
    {
      "access": "proxy",
      "basicAuth": false,
      "name": "Alertmanager",
      "type": "alertmanager",
      "url": "http://alertmanager:9093",
      "jsonData": {
        "implementation": "prometheus"
      }
    }
  ]
}
