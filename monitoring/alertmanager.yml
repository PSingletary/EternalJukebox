# Alertmanager Configuration for EternalJukebox
# This configuration handles alerting for service failures and performance issues

global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@eternaljukebox.local'
  smtp_auth_username: 'alerts@eternaljukebox.local'
  smtp_auth_password: 'password'

# The root route on which each condition comes in to the routing tree.
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m
      
    # High priority alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 30m
      
    # Service-specific routes
    - match:
        service: eternaljukebox-main
      receiver: 'main-service-alerts'
      
    - match:
        service: eternaljukebox-analysis
      receiver: 'analysis-service-alerts'
      
    - match:
        service: redis
      receiver: 'redis-alerts'
      
    - match:
        service: database
      receiver: 'database-alerts'

# Inhibition rules allow to mute a set of alerts given that another alert is
# firing.
inhibit_rules:
  # Mute any warning-level notifications if the same alert is already critical
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # Mute service-specific alerts if the entire service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*High.*'
    equal: ['service']

# Receivers
receivers:
  # Default webhook receiver
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true

  # Critical alerts - immediate notification via multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'admin@eternaljukebox.local'
        subject: '[CRITICAL] EternalJukebox Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          {{ end }}
        headers:
          X-Priority: '1'
    
    webhook_configs:
      - url: 'http://localhost:5001/webhook/critical'
        send_resolved: true
        http_config:
          basic_auth:
            username: 'webhook'
            password: 'password'

  # Warning alerts - less urgent notification
  - name: 'warning-alerts'
    email_configs:
      - to: 'admin@eternaljukebox.local'
        subject: '[WARNING] EternalJukebox Alert: {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          {{ end }}
    
    webhook_configs:
      - url: 'http://localhost:5001/webhook/warning'
        send_resolved: true

  # Main service specific alerts
  - name: 'main-service-alerts'
    email_configs:
      - to: 'main-service@eternaljukebox.local'
        subject: '[MAIN SERVICE] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          {{ end }}

  # Analysis service specific alerts
  - name: 'analysis-service-alerts'
    email_configs:
      - to: 'analysis-service@eternaljukebox.local'
        subject: '[ANALYSIS SERVICE] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          {{ end }}

  # Redis specific alerts
  - name: 'redis-alerts'
    email_configs:
      - to: 'redis@eternaljukebox.local'
        subject: '[REDIS] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          {{ end }}

  # Database specific alerts
  - name: 'database-alerts'
    email_configs:
      - to: 'database@eternaljukebox.local'
        subject: '[DATABASE] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          {{ end }}

# Templates for customizing alert messages
templates:
  - '/etc/alertmanager/templates/*.tmpl'
