version: '3'
services:
  main:
    build: .
    image: eternaljukebox
    restart: always
    networks:
      - internal
    ports:
      - 8080:8080
    env_file:
      - .env
    environment:
      - ANALYSIS_SERVICE_URL=http://analysis-service:5000
    volumes:
      - './envvar_config.yaml:/EternalJukebox/envvar_config.yaml'
      - './data:/EternalJukebox/data'
      - './database/eternal_jukebox.mv.db:/EternalJukebox/eternal_jukebox.mv.db' #used for H2 db. Needs to copied from /database/eternal_jukebox.mv.db.init
    depends_on:
      - analysis-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  analysis-service:
    build:
      context: ./analysis-service
      dockerfile: Dockerfile
    image: eternaljukebox-analysis
    restart: always
    networks:
      - internal
    ports:
      - 5000:5000
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
    volumes:
      - './data/analysis:/tmp/audio_uploads'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  #db:
