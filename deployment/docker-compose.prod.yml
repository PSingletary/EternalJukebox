version: '3.8'

services:
  eternaljukebox-main:
    image: ${REGISTRY_NAME}.azurecr.io/eternaljukebox-main:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - eternaljukebox-network
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ANALYSIS_SERVICE_URL=http://eternaljukebox-analysis:5000
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - STORAGE_TYPE=LOCAL
      - DATABASE_TYPE=H2
      - WORKER_EXECUTE_TIME=1200000000000
    volumes:
      - eternaljukebox-data:/EternalJukebox/data
      - eternaljukebox-database:/EternalJukebox/database
      - eternaljukebox-logs:/EternalJukebox/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eternaljukebox.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.eternaljukebox.tls=true"
      - "traefik.http.routers.eternaljukebox.tls.certresolver=letsencrypt"
      - "traefik.http.services.eternaljukebox.loadbalancer.server.port=8080"

  eternaljukebox-analysis:
    image: ${REGISTRY_NAME}.azurecr.io/eternaljukebox-analysis:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - eternaljukebox-network
    environment:
      - FLASK_ENV=production
      - PYTHONPATH=/app
      - WORKERS=${ANALYSIS_WORKERS:-2}
    volumes:
      - eternaljukebox-analysis-data:/tmp/audio_uploads
      - eternaljukebox-analysis-cache:/tmp/analysis_cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    depends_on:
      - eternaljukebox-main

  # Optional: Redis for caching analysis results
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - eternaljukebox-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Optional: Traefik reverse proxy with SSL
  traefik:
    image: traefik:v3.0
    restart: unless-stopped
    networks:
      - eternaljukebox-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certificates:/certificates
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json
      - --global.sendanonymoususage=false
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN_NAME}`)"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.service=api@internal"

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    networks:
      - eternaljukebox-network
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.${DOMAIN_NAME}`)"
      - "traefik.http.routers.prometheus.tls=true"
      - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    networks:
      - eternaljukebox-network
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN_NAME}`)"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"

networks:
  eternaljukebox-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  eternaljukebox-data:
    driver: local
  eternaljukebox-database:
    driver: local
  eternaljukebox-logs:
    driver: local
  eternaljukebox-analysis-data:
    driver: local
  eternaljukebox-analysis-cache:
    driver: local
  redis-data:
    driver: local
  traefik-certificates:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
